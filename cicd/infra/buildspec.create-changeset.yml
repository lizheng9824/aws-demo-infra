version: 0.2
phases:
  install:
    runtime-versions:
      python: 3.9
    commands:
      - echo Installing linters and awscli
      - pip install --upgrade pip
      - pip install cfn-lint yamllint
      - yum install -y jq || true
  build:
    commands:
      - echo Linting YAML files in common/
      - for f in common/*.yaml; do echo "lint $f"; cfn-lint "$f" || true; done
      - echo Creating CloudFormation change sets for each template in common/
      - mkdir -p output
      - changes_file=output/changesets.txt
      - printf '' > "$changes_file"
      - |
        for f in common/*.yaml; do
          name=$(basename "$f" .yaml)
          stack_name="${STACK_PREFIX:-aws-demo}-$name"
          csname="changeset-${CODEBUILD_BUILD_ID}-$name"
          echo "Creating change set for $stack_name from $f"
          aws cloudformation create-change-set --stack-name "$stack_name" --change-set-name "$csname" --template-body file://"$f" --capabilities CAPABILITY_NAMED_IAM || true
          echo "$stack_name|$csname" >> "$changes_file"
        done
artifacts:
  files:
    - output/**
  discard-paths: no
